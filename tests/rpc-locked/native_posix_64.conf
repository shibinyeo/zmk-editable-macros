CONFIG_GPIO=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_DEBUG=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# A real settings backend: NVS on the simulated flash, as on the keyboard.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# ZMK Studio, so its real RPC thread, framing and dispatch run. The wire is replaced by
# the test transport in src/em_test_rpc.c.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256

CONFIG_ZMK_STUDIO_LOCKING=y
